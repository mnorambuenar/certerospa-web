<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tarjeta social (og:image / twitter:image) de certerospa.cl, 1200x630.
  Reutiliza el mark de producción tal cual (marketing/assets/logo-certero.svg,
  grupo "logo-certero-principal") — mismos paths, mismo trazo, sin reinterpretar el logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img"
     aria-label="Certero — punto de encuentro">
  <title>Certero — punto de encuentro</title>
  <rect x="0" y="0" width="1200" height="630" fill="#0E6F6B"/>

  <!-- mark, escalado del original 100x100 -->
  <g transform="translate(90,175) scale(2.8)">
    <rect x="0" y="0" width="100" height="100" rx="26" fill="#0A4A47"/>
    <path d="M22 68 C 30 68, 40 60, 50 40" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
    <path d="M78 68 C 70 68, 60 60, 50 40" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
  </g>

  <text x="460" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="88" fill="#FFFFFF">certero</text>
  <text x="462" y="390" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="34" fill="#E4F1EF">Se encuentran. Se confirman. Se contactan.</text>
  <text x="462" y="440" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="28" fill="#B7D6D3">Match directo por WhatsApp, sin CV ni ranking automático.</text>
</svg>
